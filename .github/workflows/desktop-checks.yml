name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to verify
        type: choice
        options: [windows, all]
        default: windows
      qualify_runtime:
        description: Install the Windows app and exercise pinned models (about 2 GB download)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '[{"os":"windows-latest","bundle":"nsis","build":"desktop:bundle:windows"}]' || '[{"os":"macos-latest","bundle":"app","build":"desktop:build:mac"},{"os":"windows-latest","bundle":"nsis","build":"desktop:bundle:windows"}]') }}
    runs-on: ${{ matrix.os }}
    # Manual qualification defaults to Windows; push/PR checks retain both platforms.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Windows GUI probe regression fixtures
        if: runner.os == 'Windows'
        run: ./scripts/test_windows_gui_probe.ps1 -WorkDirectory "${{ runner.temp }}/cachella-gui-probe"
      - name: Retain GUI probe fixture reports
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-probe-fixtures
          path: ${{ runner.temp }}/cachella-gui-probe/
          retention-days: 3
      - name: Parse Windows qualification script
        if: runner.os == 'Windows'
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/qualify_windows.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
      - name: Verify Windows decoder source downloads before compilation
        if: runner.os == 'Windows'
        run: |
          $sources = Join-Path $env:RUNNER_TEMP 'cachella-decoder-sources'
          New-Item -ItemType Directory -Force -Path $sources | Out-Null
          python3 -c 'import pathlib,sys; sys.path.insert(0,"scripts"); import prepare_decoder as p; root=pathlib.Path(sys.argv[1]); [p.obtain(source,root/source.filename,None) for source in p.sources_for("windows-x86_64")]; print("PASS: all three decoder source archives match pinned sizes and hashes")' $sources
          if ($LASTEXITCODE -ne 0) { throw 'Decoder source verification failed before compilation.' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:rust
      - name: Windows scratch reparse-point regression
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --features desktop scratch::windows::tests::deleting_a_reparse_child_never_traverses_its_target -- --ignored
      - run: npm run check:rust
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: macOS decoder build tools
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Windows decoder build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            python
            make
            pkgconf
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
      - name: Build Windows decoder from pinned source
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          /usr/bin/python3 -m unittest discover -s scripts -p "test_prepare_decoder.py"
          /usr/bin/python3 scripts/prepare_decoder.py --platform windows-x86_64 --replace --sources "$(cygpath -u "$RUNNER_TEMP")/cachella-decoder-sources"
      - name: Windows decoder production import smoke
        if: runner.os == 'Windows'
        run: >-
          cargo run --manifest-path src-tauri/Cargo.toml --example decode_smoke --features desktop --
          src-tauri/resources/decoder/ffmpeg.exe
          evaluation/multimodal/fixtures/red-circle.png evaluation/multimodal/fixtures/blue-square.png
          evaluation/multimodal/fixtures/budget.wav evaluation/multimodal/fixtures/lunch.wav
          evaluation/multimodal/fixtures/temporal-video.mp4 evaluation/multimodal/fixtures/budget-video.mp4
          evaluation/decoders/fixtures/image.jpg evaluation/decoders/fixtures/audio.mp3
          evaluation/decoders/fixtures/audio.flac evaluation/decoders/fixtures/audio.ogg
          evaluation/decoders/fixtures/video.webm
      - name: Build Windows release installer
        if: runner.os == 'Windows'
        run: npm run ${{ matrix.build }} -- --bundles ${{ matrix.bundle }}
      - name: Build macOS debug bundle
        if: runner.os == 'macOS'
        run: npm run ${{ matrix.build }} -- --debug --bundles ${{ matrix.bundle }}

      - name: Retain Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cachella-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
      - name: Windows installer and real-model qualification
        if: runner.os == 'Windows' && inputs.qualify_runtime
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one release NSIS installer.' }
          ./scripts/qualify_windows.ps1 -WorkDirectory "${{ runner.temp }}/cachella-qualification" -InstallerPath $installers[0].FullName
      - name: Retain Windows qualification reports
        if: always() && runner.os == 'Windows' && inputs.qualify_runtime
        uses: actions/upload-artifact@v4
        with:
          name: cachella-windows-qualification
          path: ${{ runner.temp }}/cachella-qualification/reports/
          if-no-files-found: warn
          retention-days: 3
