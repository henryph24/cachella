[package]
name = "cachella-scratch-check"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

# Compile the production source and its tests without requiring desktop/C SDKs.
[lib]
path = "lib.rs"

[dependencies]
cap-std = "3"
cap-fs-ext = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
