[package]
name = "cachella"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Local-first enterprise knowledge workspace"

[lib]
name = "cachella_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cachella"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:rfd"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
rcgen = "0.14"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "process", "io-util", "fs"] }

base64 = "0.22"
lopdf = { version = "=0.45.0", path = "../vendor/lopdf", default-features = false }
cap-std = "3"
cap-fs-ext = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
